<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Admin | ECON Kitchen</title>
    <meta name="theme-color" content="#201c19">
    <link
        rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/header.css">
    <link rel="stylesheet" href="/assets/css/admin.css">
  <link rel="stylesheet" href="/assets/css/typography.css">
    <link rel="stylesheet" href="/assets/css/readability.css">
    <link rel="stylesheet" href="/assets/css/translator.css">
    <link rel="stylesheet" href="../assets/css/responsive-master.css">
 
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

<body>
    <div id="header-slot"></div>
    <div class="adminbar">
        <div class="container"><b>ECON Kitchen • Admin CMS</b><button class="btn btn-light" id="logout">Logout</button>
        </div>
    </div>
    <main class="admin container">
        <section id="loginBox" class="login card"><span class="eyebrow">Secure Admin</span>
            <h2>Sign in</h2>
            <form id="loginForm"><input type="email" name="email" required placeholder="Admin email"><input
                    type="password" name="password" required placeholder="Password"><button class="btn btn-primary">SIGN
                    IN</button></form>
            <p class="muted">Enable Email/Password Authentication in Firebase.</p>
        </section>
        <section id="cms" class="admin-grid hidden">
            <aside class="adminnav card" id="adminNav"></aside>
            <div class="panel card">
                <div class="section-head">
                    <div><span class="eyebrow">CONTENT MANAGER</span>
                        <h2 id="collectionTitle">Content</h2>
                    </div><button class="btn btn-primary" id="addNew">+ Add New</button>
                </div>
                <form id="editor" class="hidden"></form>
                <div id="records"></div>
            </div>
        </section>
    </main>
    <script type="module" src="/assets/js/admin.js"></script>
    <script type="module" src="/assets/js/components.js"></script>
    <script src="/assets/js/translator.js"></script>
</body>

</html>
