<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Stories | ECON Kitchen</title>

    <meta
        name="description"
        content="Explore kitchen and interior project images from ECON Kitchen customer stories."
    >

    <link
        rel="icon"
        type="image/png"
        href="/assets/images/favicon.png"
    >

    <!-- EXISTING WEBSITE STYLES -->
    <link rel="stylesheet" href="/assets/css/home.css">
    <link rel="stylesheet" href="/assets/css/header.css">
    <link rel="stylesheet" href="/assets/css/responsive-master.css">

    <!-- POPPINS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- ICONS -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >

    <style>
        /* =====================================================
           ECON KITCHEN — CUSTOMER STORIES

           Page styles are scoped to .econ-stories.
           Shared header and footer keep their existing styles.
        ===================================================== */

        .econ-stories {
            --stories-background: #faf8f3;
            --stories-card: #ffffff;
            --stories-text: #202020;
            --stories-muted: #727272;
            --stories-gold: #c9a227;
            --stories-gold-dark: #896815;
            --stories-gold-light: #fbf3df;
            --stories-border: #eae5da;

            background: var(--stories-background);
            color: var(--stories-text);
            font-family: "Poppins", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .econ-stories,
        .econ-stories * {
            box-sizing: border-box;
        }

        .econ-stories .stories-container {
            width: min(1240px, calc(100% - 48px));
            margin-inline: auto;
        }

        /* =========================
           PAGE HEADING
        ========================= */

        .econ-stories .stories-section {
            padding: 76px 0 90px;
        }

        .econ-stories .stories-heading {
            max-width: 920px;
            margin: 0 auto 48px;
            text-align: center;
        }

        .econ-stories .stories-eyebrow {
            display: inline-block;
            margin-bottom: 16px;
            color: var(--stories-gold-dark);
            font-size: 15px;
            font-weight: 600;
            line-height: 1.5;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .econ-stories .stories-heading h1 {
            margin: 0;
            color: var(--stories-text);
            font-family: inherit;
            font-size: clamp(32px, 4.3vw, 56px);
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: -1.5px;
        }

        .econ-stories .stories-heading h1 em {
            color: var(--stories-gold-dark);
            font-weight: inherit;
        }

        .econ-stories .stories-heading-line {
            width: 66px;
            height: 3px;
            margin: 24px auto 0;
            border-radius: 999px;
            background: var(--stories-gold);
        }

        /* =========================
           CARD GRID
        ========================= */

        .econ-stories .stories-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 28px;
        }

        .econ-stories .story-card {
            min-width: 0;
            overflow: hidden;
            border: 1px solid var(--stories-border);
            border-radius: 20px;
            background: var(--stories-card);
            box-shadow: 0 8px 28px rgba(45, 35, 15, 0.035);
            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                border-color 0.25s ease;
        }

        /* =========================
           PROJECT IMAGE
        ========================= */

        .econ-stories .story-image-wrap {
            position: relative;
            overflow: hidden;
            aspect-ratio: 4 / 3;
            background: #eee9df;
        }

        .econ-stories .story-image {
            display: block;
            width: 100%;
            height: 100%;
            margin: 0;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        /* =========================
           CATEGORY / NAME / LOCATION
        ========================= */

        .econ-stories .story-details {
            padding: 24px;
        }

        .econ-stories .story-category {
            display: inline-block;
            max-width: 100%;
            margin-bottom: 17px;
            padding: 7px 13px;
            border-radius: 999px;
            background: var(--stories-gold-light);
            color: var(--stories-gold-dark);
            font-size: 15px;
            font-weight: 500;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .econ-stories .story-name {
            margin: 0 0 9px;
            color: var(--stories-text);
            font-family: inherit;
            font-size: 21px;
            font-weight: 600;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .econ-stories .story-location {
            display: flex;
            align-items: baseline;
            gap: 9px;
            margin: 0;
            color: var(--stories-muted);
            font-size: 16px;
            font-weight: 400;
            line-height: 1.6;
        }

        .econ-stories .story-location i {
            flex-shrink: 0;
            color: var(--stories-gold-dark);
            font-size: 16px;
        }

        .econ-stories .story-location span {
            overflow-wrap: anywhere;
        }

        @media (hover: hover) and (pointer: fine) {
            .econ-stories .story-card:hover {
                transform: translateY(-5px);
                border-color: #d9c68e;
                box-shadow: 0 16px 36px rgba(45, 35, 15, 0.08);
            }

            .econ-stories .story-card:hover .story-image {
                transform: scale(1.035);
            }
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1024px) {
            .econ-stories .stories-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 24px;
            }

            .econ-stories .stories-section {
                padding: 60px 0 70px;
            }
        }

        @media (max-width: 600px) {
            .econ-stories .stories-container {
                width: calc(100% - 32px);
            }

            .econ-stories .stories-section {
                padding: 42px 0 52px;
            }

            .econ-stories .stories-heading {
                margin-bottom: 30px;
            }

            .econ-stories .stories-eyebrow {
                margin-bottom: 12px;
                letter-spacing: 2px;
            }

            .econ-stories .stories-heading h1 {
                font-size: 34px;
                letter-spacing: -0.8px;
            }

            .econ-stories .stories-heading-line {
                margin-top: 20px;
            }

            .econ-stories .stories-grid {
                grid-template-columns: minmax(0, 1fr);
                gap: 22px;
            }

            .econ-stories .story-card {
                border-radius: 18px;
            }

            .econ-stories .story-details {
                padding: 21px;
            }

            .econ-stories .story-name {
                font-size: 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .econ-stories .story-card,
            .econ-stories .story-image {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <!-- EXISTING HEADER -->
    <div id="header-slot"></div>

    <main class="econ-stories">

        <section
            class="stories-section"
            aria-labelledby="storiesTitle"
        >
            <div class="stories-container">

                    <span class="stories-eyebrow">

                    </span>

                    <h1 id="storiesTitle">

                        <em>Happy customers.</em>
                    </h1>

                    <div
                        class="stories-heading-line"
                        aria-hidden="true"
                    ></div>

                </header>

                <!-- CARDS ARE RENDERED FROM THE DATA BELOW -->
                <div
                    class="stories-grid"

                ></div>

                <noscript>
                    <p>Please enable JavaScript to view customer stories.</p>
                </noscript>

            </div>
        </section>

    </main>

    <!-- EXISTING FOOTER -->
    <div id="footer-slot"></div>

    <!-- EXISTING HEADER / FOOTER COMPONENTS -->
    <script src="/assets/js/components.js"></script>

    <script>
(() => {
    "use strict";

    /* =====================================================
       SETTINGS
       WhatsApp number: country code + number, without +
    ===================================================== */

    const WHATSAPP_NUMBER = "917060966889";

    /* =====================================================
       CUSTOMER DATA
       Each folder uses its first image: 1.webp

       Category labels can be changed below.
    ===================================================== */

    const testimonials = [
        {
            name: "Umesh Verma Ji",
            location: "Radha Puram, Vrindaban Road, Mathura",
            category: "Customer Project",
            folder:
                "Umesh Verma Ji, Radha Puram, Vrindaban Road, Mathura"
        },
        {
            name: "Rutvij Charkol",
            location: "",
            category: "Customer Project",
            folder: "rutvij charkol"
        },
        {
            name: "Pinky Mam",
            location: "Techmen City",
            category: "Customer Project",
            folder: "Pinky Mam Techmen City"
        },
        {
            name: "Poonam Mam",
            location: "Pushpanjali",
            category: "Customer Project",
            folder: "Poonam Mam Pushpanjali"
        },
        {
            name: "Guddan Saxena Ji",
            location: "Sadar Bazar, Mathura",
            category: "Customer Project",
            folder: "Guddan Saxena Ji, Sadar Bazar, Mathura"
        },
        {
            name: "Divya Mundra",
            location: "Mainpuri",
            category: "Customer Project",
            folder: "Divya Mundra, Mainpuri"
        },
        {
            name: "Abhishek Mishra Ji",
            location: "Kosi Kalan",
            category: "Customer Project",
            folder: "Abhishek Mishra Ji - Kosi Kalan"
        },
        {
            name: "Dinesh Sharma Ji",
            location: "Ananda Van, Naurangabad, NH 2, Mathura",
            category: "Customer Project",
            folder:
                "Dinesh Sharma Ji -Ananda Van, Naurangabad, NH 2, Mathura"
        }
    ];

    const fallbackImage =
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="800" height="600" viewBox="0 0 800 600">
                <rect width="800" height="600" fill="#eee9df"/>
                <g fill="none" stroke="#b7a77d" stroke-width="5"
                   stroke-linecap="round" stroke-linejoin="round">
                    <rect x="330" y="245" width="140"
                          height="110" rx="12"/>
                    <circle cx="370" cy="278" r="11"/>
                    <path d="M345 337l38-38 25 25 23-26 24 39"/>
                </g>
            </svg>
        `);

    function getImageUrl(item) {
        return "/assets/images/reviews/" +
            encodeURIComponent(item.folder) +
            "/1.webp";
    }

    function setImage(image, item) {
        image.onerror = function () {
            image.onerror = null;
            image.src = fallbackImage;
        };

        image.src = getImageUrl(item);

        image.alt = [
            item.category,
            item.name,
            item.location
        ].filter(Boolean).join(" — ");
    }

    /* =====================================================
       LIGHTBOX STYLES
       Added automatically; no separate CSS edit needed.
    ===================================================== */

    function addLightboxStyles() {
        const style = document.createElement("style");

        style.textContent = `
            .econ-stories .story-image-button {
                display: block;
                width: 100%;
                padding: 0;
                border: 0;
                border-radius: 0;
                background: transparent;
                cursor: zoom-in;
                font: inherit;
            }

            .econ-stories .story-image-button:focus-visible {
                outline: 3px solid #c9a227;
                outline-offset: -5px;
            }

            .econ-review-lightbox {
                width: min(1100px, calc(100% - 32px));
                max-width: none;
                max-height: calc(100dvh - 32px);
                margin: auto;
                padding: 0;
                overflow: auto;
                border: 1px solid #eae5da;
                border-radius: 20px;
                background: #ffffff;
                color: #202020;
                font-family: "Poppins", sans-serif;
                box-shadow: 0 24px 80px rgba(0,0,0,.25);
            }

            .econ-review-lightbox,
            .econ-review-lightbox * {
                box-sizing: border-box;
            }

            .econ-review-lightbox::backdrop {
                background: rgba(15,15,15,.82);
            }

            .econ-review-lightbox .erl-stage {
                position: relative;
                display: grid;
                place-items: center;
                height: min(65dvh, 650px);
                min-height: 220px;
                background: #f3f0e9;
                touch-action: pan-y;
            }

            .econ-review-lightbox .erl-image {
                display: block;
                width: 100%;
                height: 100%;
                min-height: 0;
                margin: 0;
                object-fit: contain;
            }

            .econ-review-lightbox .erl-control {
                position: absolute;
                z-index: 2;
                display: grid;
                place-items: center;
                width: 44px;
                height: 44px;
                padding: 0;
                border: 1px solid #e2ddcf;
                border-radius: 50%;
                background: #ffffff;
                color: #202020;
                font: inherit;
                font-size: 26px;
                line-height: 1;
                cursor: pointer;
                box-shadow: 0 4px 16px rgba(0,0,0,.12);
            }

            .econ-review-lightbox .erl-control:focus-visible,
            .econ-review-lightbox .erl-whatsapp:focus-visible {
                outline: 3px solid #c9a227;
                outline-offset: 3px;
            }

            .econ-review-lightbox .erl-close {
                top: 14px;
                right: 14px;
            }

            .econ-review-lightbox .erl-prev {
                left: 14px;
                top: 50%;
                transform: translateY(-50%);
            }

            .econ-review-lightbox .erl-next {
                right: 14px;
                top: 50%;
                transform: translateY(-50%);
            }

            .econ-review-lightbox .erl-footer {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 24px;
                padding: 25px 30px;
                background: #ffffff;
            }

            .econ-review-lightbox .erl-info {
                min-width: 0;
                overflow-wrap: anywhere;
            }

            .econ-review-lightbox .erl-category {
                display: inline-block;
                margin-bottom: 10px;
                padding: 6px 12px;
                border-radius: 999px;
                background: #fbf3df;
                color: #896815;
                font-size: 15px;
                line-height: 1.5;
            }

            .econ-review-lightbox .erl-name {
                margin: 0 0 8px;
                color: #202020;
                font-family: inherit;
                font-size: 23px;
                font-weight: 600;
                line-height: 1.4;
            }

            .econ-review-lightbox .erl-location {
                margin: 0;
                color: #727272;
                font-size: 16px;
                line-height: 1.6;
            }

            .econ-review-lightbox .erl-location i {
                margin-right: 7px;
                color: #896815;
            }

            .econ-review-lightbox .erl-count {
                display: block;
                margin-top: 10px;
                color: #727272;
                font-size: 15px;
            }

            .econ-review-lightbox .erl-whatsapp {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                flex-shrink: 0;
                padding: 14px 21px;
                border: 1px solid #128c45;
                border-radius: 999px;
                background: #128c45;
                color: #ffffff;
                text-decoration: none;
                font-size: 16px;
                font-weight: 500;
                line-height: 1.5;
            }

            .econ-review-lightbox .erl-whatsapp i {
                font-size: 22px;
            }

            @media (max-width: 600px) {
                .econ-review-lightbox {
                    width: calc(100% - 20px);
                    max-height: calc(100dvh - 20px);
                    border-radius: 16px;
                }

                .econ-review-lightbox .erl-stage {
                    height: 44dvh;
                    min-height: 190px;
                }

                .econ-review-lightbox .erl-footer {
                    flex-direction: column;
                    align-items: stretch;
                    gap: 20px;
                    padding: 22px;
                }

                .econ-review-lightbox .erl-name {
                    font-size: 20px;
                }

                .econ-review-lightbox .erl-control {
                    width: 38px;
                    height: 38px;
                }

                .econ-review-lightbox .erl-prev {
                    left: 8px;
                }

                .econ-review-lightbox .erl-next {
                    right: 8px;
                }

                .econ-review-lightbox .erl-whatsapp {
                    width: 100%;
                }
            }
        `;

        document.head.appendChild(style);
    }

    /* =====================================================
       INITIALIZE
    ===================================================== */

    function initializeStories() {
        const grid = document.getElementById("testimonialGrid");

        if (!grid || !testimonials.length) return;

        addLightboxStyles();

        let activeIndex = 0;
        let previousOverflow = "";
        let openingButton = null;
        let touchStart = null;

        /* CREATE POPUP */
        const dialog = document.createElement("dialog");

        dialog.className = "econ-review-lightbox";
        dialog.setAttribute("aria-labelledby", "erlCustomerName");

        dialog.innerHTML = `
            <div class="erl-stage">
                <img class="erl-image" alt="">

                <button class="erl-control erl-close"
                        type="button"
                        aria-label="Close image"
                        autofocus>×</button>

                <button class="erl-control erl-prev"
                        type="button"
                        aria-label="Previous customer project">‹</button>

                <button class="erl-control erl-next"
                        type="button"
                        aria-label="Next customer project">›</button>
            </div>

            <div class="erl-footer">
                <div class="erl-info" aria-live="polite">
                    <span class="erl-category"></span>
                    <h2 class="erl-name" id="erlCustomerName"></h2>

                    <p class="erl-location">
                        <i class="fa-solid fa-location-dot"
                           aria-hidden="true"></i>
                        <span></span>
                    </p>

                    <span class="erl-count"></span>
                </div>

                <a class="erl-whatsapp"
                   target="_blank"
                   rel="noopener noreferrer">
                    <i class="fa-brands fa-whatsapp"
                       aria-hidden="true"></i>
                    WhatsApp पर मदद लें
                </a>
            </div>
        `;

        document.body.appendChild(dialog);

        const popupImage = dialog.querySelector(".erl-image");
        const popupCategory = dialog.querySelector(".erl-category");
        const popupName = dialog.querySelector(".erl-name");
        const popupLocation = dialog.querySelector(".erl-location");
        const popupLocationText = popupLocation.querySelector("span");
        const popupCount = dialog.querySelector(".erl-count");
        const whatsappButton = dialog.querySelector(".erl-whatsapp");
        const stage = dialog.querySelector(".erl-stage");
        const previousButton = dialog.querySelector(".erl-prev");
        const nextButton = dialog.querySelector(".erl-next");

        previousButton.hidden = testimonials.length < 2;
        nextButton.hidden = testimonials.length < 2;

        /* UPDATE IMAGE AND CUSTOMER DETAILS */
        function updateLightbox() {
            const item = testimonials[activeIndex];

            setImage(popupImage, item);

            popupCategory.textContent = item.category;
            popupName.textContent = item.name;

            popupLocation.hidden = !item.location;
            popupLocationText.textContent = item.location || "";

            popupCount.textContent =
                `${activeIndex + 1} / ${testimonials.length}`;

            const message = [
                "Hello ECON Kitchen!",
                "",
                "I need your assistance with a similar design.",
                `Reference customer: ${item.name}`,
                item.location ? `Location: ${item.location}` : "",
                `Project: ${item.category}`,
                "",
                "Please help me with design options and an estimate."
            ].filter(Boolean).join("\n");

            whatsappButton.href =
                "https://wa.me/" +
                WHATSAPP_NUMBER +
                "?text=" +
                encodeURIComponent(message);
        }

        function openLightbox(index, button) {
            activeIndex = index;
            openingButton = button;

            updateLightbox();

            previousOverflow = document.body.style.overflow;
            dialog.showModal();
            document.body.style.overflow = "hidden";
        }

        function moveSlide(direction) {
            activeIndex =
                (activeIndex + direction + testimonials.length) %
                testimonials.length;

            updateLightbox();
        }

        dialog.querySelector(".erl-close").addEventListener(
            "click",
            () => dialog.close()
        );

        previousButton.addEventListener("click", () => moveSlide(-1));
        nextButton.addEventListener("click", () => moveSlide(1));

        /* ESCAPE CLOSES THE NATIVE DIALOG AUTOMATICALLY */
        dialog.addEventListener("close", () => {
            document.body.style.overflow = previousOverflow;
            touchStart = null;

            if (openingButton && openingButton.isConnected) {
                openingButton.focus({ preventScroll: true });
            }
        });

        /* CLICK OUTSIDE TO CLOSE */
        dialog.addEventListener("click", event => {
            if (event.target !== dialog) return;

            const bounds = dialog.getBoundingClientRect();

            if (
                event.clientX < bounds.left ||
                event.clientX > bounds.right ||
                event.clientY < bounds.top ||
                event.clientY > bounds.bottom
            ) {
                dialog.close();
            }
        });

        /* KEYBOARD NAVIGATION */
        dialog.addEventListener("keydown", event => {
            if (event.key === "ArrowRight") {
                event.preventDefault();
                moveSlide(1);
            }

            if (event.key === "ArrowLeft") {
                event.preventDefault();
                moveSlide(-1);
            }
        });

        /* MOBILE SWIPE */
        stage.addEventListener("touchstart", event => {
            if (
                event.touches.length !== 1 ||
                event.target.closest("button")
            ) {
                touchStart = null;
                return;
            }

            touchStart = {
                x: event.touches[0].clientX,
                y: event.touches[0].clientY
            };
        }, { passive: true });

        stage.addEventListener("touchend", event => {
            if (!touchStart || !event.changedTouches.length) return;

            const dx =
                event.changedTouches[0].clientX - touchStart.x;
            const dy =
                event.changedTouches[0].clientY - touchStart.y;

            touchStart = null;

            if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
                moveSlide(dx < 0 ? 1 : -1);
            }
        }, { passive: true });

        stage.addEventListener("touchcancel", () => {
            touchStart = null;
        }, { passive: true });

        /* =====================================================
           RENDER PAGE CARDS
        ===================================================== */

        const fragment = document.createDocumentFragment();

        testimonials.forEach((item, index) => {
            const card = document.createElement("article");
            card.className = "story-card";

            const imageButton = document.createElement("button");
            imageButton.type = "button";
            imageButton.className = "story-image-button";
            imageButton.setAttribute("aria-haspopup", "dialog");
            imageButton.setAttribute(
                "aria-label",
                `View ${item.name}'s project image`
            );

            const imageWrap = document.createElement("div");
            imageWrap.className = "story-image-wrap";

            const image = document.createElement("img");
            image.className = "story-image";
            image.width = 800;
            image.height = 600;
            image.loading = index < 3 ? "eager" : "lazy";
            image.decoding = "async";

            setImage(image, item);

            imageWrap.appendChild(image);
            imageButton.appendChild(imageWrap);

            imageButton.addEventListener("click", () => {
                openLightbox(index, imageButton);
            });

            const details = document.createElement("div");
            details.className = "story-details";

            const category = document.createElement("span");
            category.className = "story-category";
            category.textContent = item.category;

            const name = document.createElement("h2");
            name.className = "story-name";
            name.textContent = item.name;

            details.append(category, name);

            if (item.location) {
                const location = document.createElement("p");
                location.className = "story-location";

                const icon = document.createElement("i");
                icon.className = "fa-solid fa-location-dot";
                icon.setAttribute("aria-hidden", "true");

                const text = document.createElement("span");
                text.textContent = item.location;

                location.append(icon, text);
                details.appendChild(location);
            }

            card.append(imageButton, details);
            fragment.appendChild(card);
        });

        grid.replaceChildren(fragment);
    }

    if (document.readyState === "loading") {
        document.addEventListener(
            "DOMContentLoaded",
            initializeStories,
            { once: true }
        );
    } else {
        initializeStories();
    }
})();
</script>

</body>
</html>
