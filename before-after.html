<!DOCTYPE html>
<html lang="en">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Before & After | ECON Kitchen Transformations
</title>



<link rel="stylesheet" href="/assets/css/home.css">

<link rel="stylesheet" href="/assets/css/header.css">

    <link rel="icon" type="image/png" href="/assets/images/favicon.png">
<style>*{
font-family:'Poppins',sans-serif;
}



.ba-hero{

padding:130px 0;

background:#050505;

text-align:center;

}



.ba-tag{

color:#d4af37;

letter-spacing:3px;

font-size:13px;

}



.ba-hero h1{

font-size:75px;

font-weight:700;

color:#fff;

margin:25px 0;

}



.ba-hero h1 span{

color:#d4af37;

}



.ba-hero p{

max-width:700px;

margin:auto;

color:#aaa;

font-size:18px;

}






.ba-section{

background:#080808;

padding:100px 0;

}



.ba-heading{

text-align:center;

margin-bottom:60px;

}



.ba-heading span{

color:#d4af37;

}



.ba-heading h2{

color:white;

font-size:45px;

}



.ba-heading p{

color:#999;

}







.ba-grid{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:35px;

}







.ba-card{

background:#111;

border:1px solid #222;

border-radius:25px;

overflow:hidden;

transition:.4s;

}



.ba-card:hover{

transform:translateY(-8px);

border-color:#d4af37;

}







.ba-images{

display:grid;

grid-template-columns:1fr 1fr;

height:300px;

}





.ba-image{

position:relative;

overflow:hidden;

}



.ba-image img{

width:100%;

height:100%;

object-fit:cover;

}




.ba-image span{

position:absolute;

top:15px;

left:15px;

background:#000;

color:#fff;

padding:6px 14px;

font-size:12px;

letter-spacing:1px;

z-index:2;

}



.ba-image span.after{

background:#d4af37;

color:#000;

}








.ba-content{

padding:25px;

}




.ba-content h3{

color:white;

font-size:22px;

}



.ba-content p{

color:#aaa;

}



.ba-type{

display:inline-block;

margin-top:15px;

padding:8px 15px;

border:1px solid #d4af37;

border-radius:30px;

color:#d4af37;

font-size:13px;

}








.ba-cta{

background:#111;

padding:90px 0;

text-align:center;

}



.ba-cta h2{

color:white;

font-size:42px;

}



.ba-cta p{

color:#aaa;

}



.ba-cta a{

display:inline-block;

margin-top:25px;

background:#d4af37;

color:#000;

padding:15px 35px;

border-radius:50px;

font-weight:600;

}








@media(max-width:900px){


.ba-grid{

grid-template-columns:1fr;

}



.ba-hero h1{

font-size:45px;

}



.ba-heading h2{

font-size:32px;

}



}</style>



<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">



<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


    <link rel="stylesheet" href="assets/css/responsive-master.css">
 



<body>



<div id="header-slot"></div>






<main> 






<!-- PROJECT SECTION -->


<section class="ba-section">


<div class="container">



<div class="ba-heading">


<span>
OUR PROJECTS
</span>


<h2>
Kitchen Transformations
</h2>



<p>
Every project tells a story of design,
craftsmanship and attention to detail.
</p>


</div>







<div class="ba-grid" id="baGrid">


</div>





</div>


</section>








<!-- CTA -->


<section class="ba-cta">


<div class="container">


<h2>

Ready To Transform Your Space?

</h2>


<p>

Get a personalised design consultation
with our kitchen experts.

</p>



<a href="/contact.html">

Start Your Project →

</a>



</div>


</section>






</main>







<div id="footer-slot"></div>





<script src="/assets/js/components.js"></script>

<script>
    const projects = [


{
title:"Modern L Shape Kitchen",
location:"Delhi",
before:"/assets/images/before/1.png",
after:"/assets/images/before/2.png",
type:"Modular Kitchen"
},



{
title:"Luxury Premium Kitchen",
location:"Noida",
before:"/assets/images/before/1.png",
after:"/assets/images/before/2.png",
type:"Premium Interior"
},




{
title:"Compact Kitchen Makeover",
location:"Mathura",
before:"/assets/images/before/1.png",
after:"/assets/images/before/2.png",
type:"Space Optimization"
}



];





const grid=document.getElementById("baGrid");



projects.forEach(project=>{


grid.innerHTML += `



<article class="ba-card">



<div class="ba-images">



<div class="ba-image">

 

<img src="${project.before}">


</div>





<div class="ba-image">
 


<img src="${project.after}">


</div>




</div>







<div class="ba-content">


<h3>
${project.title}
</h3>



<p>

<i class="fa-solid fa-location-dot"></i>

${project.location}

</p>




<div class="ba-type">

${project.type}

</div>



</div>




</article>



`;

});
</script>



</body>


</html>
