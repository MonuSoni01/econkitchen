<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Our Catalogue | ECON Kitchen
    </title>

    <meta
        name="description"
        content="Explore the ECON Kitchen premium modular kitchen catalogue, designs, materials and interior solutions."
    >

    <meta
        name="theme-color"
        content="#080808"
    >


    <!-- =====================================================
         GOOGLE FONT
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- =====================================================
         GLOBAL CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="/assets/css/header.css"
    >

    <link
        rel="stylesheet"
        href="/assets/css/home.css"
    >


    <!-- =====================================================
         CATALOGUE CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="/assets/css/catalogue.css"
    >


    <!-- =====================================================
         OPTIONAL GLOBAL CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="/assets/css/readability.css"
    >

    <link
        rel="stylesheet"
        href="/assets/css/translator.css"
    >

    <link rel="stylesheet" href="../assets/css/responsive-master.css">
 



<body class="catalogue-page">


<!-- =========================================================
     HEADER
========================================================= -->

<div id="header-slot"></div>



<!-- =========================================================
     MAIN
========================================================= -->

<main>


    <!-- =====================================================
         ECON KITCHEN
         CATALOGUE SECTION
    ====================================================== -->

    <section
        class="catalogue-section"
        id="catalogueSection"
    >


        <div class="catalogue-container">


            <!-- =================================================
                 HEADING
            ================================================== -->

            <header class="catalogue-heading">


                <span class="catalogue-eyebrow">

                    ECON COLLECTION

                </span>


                <h1>

                    Our Catalogue

                </h1>


                <p>

                    Explore our collection page by page.

                </p>


            </header>



            <!-- =================================================
                 VIEWER
            ================================================== -->

            <div
                class="catalogue-viewer"
                id="catalogueViewer"
            >


                <!-- =============================================
                     LOADING STATE
                ============================================== -->

                <div
                    class="catalogue-loader"
                    id="catalogueLoader"
                    role="status"
                    aria-live="polite"
                >


                    <div
                        class="catalogue-loader-spinner"
                    ></div>


                    <strong>

                        Loading Catalogue...

                    </strong>


                    <span
                        id="catalogueProgress"
                    >

                        Preparing PDF

                    </span>


                </div>



                <!-- =============================================
                     ERROR STATE
                ============================================== -->

                <div
                    class="catalogue-error"
                    id="catalogueError"
                    hidden
                >


                    <div
                        class="catalogue-error-icon"
                    >

                        <i
                            class="fa-solid fa-triangle-exclamation"
                        ></i>

                    </div>


                    <strong>

                        Unable to load catalogue.

                    </strong>


                    <p>

                        Please refresh the page or try again later.

                    </p>


                </div>



                <!-- =============================================
                     FLIPBOOK STAGE
                ============================================== -->

                <div
                    class="catalogue-stage"
                    id="catalogueStage"
                    hidden
                >


                    <div
                        class="catalogue-book-shell"
                        id="catalogueBookShell"
                    >


                        <!--
                            PDF.js will dynamically
                            render catalogue pages here
                        -->

                        <div
                            class="catalogue-book"
                            id="catalogueBook"
                            aria-label="ECON Digital Catalogue"
                        ></div>


                    </div>


                </div>


            </div>



            <!-- =================================================
                 PAGE NAVIGATION
            ================================================== -->

            <div
                class="catalogue-navigation"
                id="catalogueNavigation"
                hidden
            >


                <!-- PREVIOUS -->

                <button
                    class="catalogue-nav-btn"
                    id="cataloguePrev"
                    type="button"
                    aria-label="Previous catalogue page"
                >


                    <i
                        class="fa-solid fa-chevron-left"
                    ></i>


                    <span>

                        Previous

                    </span>


                </button>



                <!-- PAGE COUNTER -->

                <div
                    class="catalogue-page-counter"
                    id="cataloguePageCounter"
                    aria-live="polite"
                >

                    1 / 10

                </div>



                <!-- NEXT -->

                <button
                    class="catalogue-nav-btn"
                    id="catalogueNext"
                    type="button"
                    aria-label="Next catalogue page"
                >


                    <span>

                        Next

                    </span>


                    <i
                        class="fa-solid fa-chevron-right"
                    ></i>


                </button>


            </div>



            <!-- =================================================
                 CATALOGUE TOOLBAR
            ================================================== -->

            <div
                class="catalogue-toolbar"
                id="catalogueToolbar"
                hidden
            >


                <!-- ZOOM OUT -->

                <button
                    class="catalogue-tool-btn"
                    id="catalogueZoomOut"
                    type="button"
                    aria-label="Zoom out"
                    title="Zoom Out"
                >


                    <i
                        class="fa-solid fa-magnifying-glass-minus"
                    ></i>


                    <span>

                        Zoom Out

                    </span>


                </button>



                <!-- ZOOM VALUE -->

                <div
                    class="catalogue-zoom-value"
                    id="catalogueZoomValue"
                >

                    100%

                </div>



                <!-- ZOOM IN -->

                <button
                    class="catalogue-tool-btn"
                    id="catalogueZoomIn"
                    type="button"
                    aria-label="Zoom in"
                    title="Zoom In"
                >


                    <i
                        class="fa-solid fa-magnifying-glass-plus"
                    ></i>


                    <span>

                        Zoom In

                    </span>


                </button>



                <!-- RESET -->

                <button
                    class="catalogue-tool-btn"
                    id="catalogueZoomReset"
                    type="button"
                    aria-label="Reset catalogue zoom"
                    title="Reset Zoom"
                >


                    <i
                        class="fa-solid fa-rotate-left"
                    ></i>


                    <span>

                        Reset

                    </span>


                </button>



                <!-- DIVIDER -->

                <span
                    class="catalogue-toolbar-divider"
                    aria-hidden="true"
                ></span>



                <!-- FULLSCREEN -->

                <button
                    class="catalogue-tool-btn"
                    id="catalogueFullscreen"
                    type="button"
                    aria-label="Open catalogue fullscreen"
                    title="Fullscreen"
                >


                    <i
                        class="fa-solid fa-expand"
                    ></i>


                    <span>

                        Fullscreen

                    </span>


                </button>



                <!-- DOWNLOAD -->

                <a
                    class="catalogue-tool-btn catalogue-download-btn"
                    href="/pdf/New-flipbook.pdf"
                    download="New-flipbook.pdf"
                    aria-label="Download ECON catalogue"
                    title="Download Catalogue"
                >


                    <i
                        class="fa-solid fa-download"
                    ></i>


                    <span>

                        Download Catalogue

                    </span>


                </a>


            </div>



            <!-- =================================================
                 HELP TEXT
            ================================================== -->

            <p
                class="catalogue-help"
                id="catalogueHelp"
                hidden
            >


                <i
                    class="fa-regular fa-hand-pointer"
                ></i>


                Drag a page, click its edge, swipe,
                or use the arrow keys.


            </p>


        </div>


    </section>


</main>



<!-- =========================================================
     FOOTER
========================================================= -->

<div id="footer-slot"></div>



<!-- =========================================================
     PDF.JS
========================================================= -->

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
></script>



<!-- =========================================================
     PAGE FLIP
========================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"
></script>



<!-- =========================================================
     CATALOGUE JS
========================================================= -->

<script
    src="/assets/js/catalogue.js"
></script>



<!-- =========================================================
     GLOBAL COMPONENTS
     HEADER + FOOTER
========================================================= -->

<script
    type="module"
    src="/assets/js/components.js"
></script>



<!-- =========================================================
     TRANSLATOR
========================================================= -->

<script
    src="/assets/js/translator.js"
></script>


</body>

</html>
